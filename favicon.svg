<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="b">
      <circle cx="16" cy="16" r="14"/>
    </clipPath>
  </defs>
  <!-- Ball base -->
  <circle cx="16" cy="16" r="14" fill="#ffffff"/>
  <!-- Black patches, clipped to ball -->
  <g clip-path="url(#b)" fill="#1a1a1a">
    <!-- Central pentagon -->
    <polygon points="16,9 21,13 19,19 13,19 11,13"/>
    <!-- Top -->
    <polygon points="16,9 13,4.5 16,1.5 19,4.5"/>
    <!-- Upper-left -->
    <polygon points="11,13 6.5,12 7,6 13,4.5 16,9"/>
    <!-- Upper-right -->
    <polygon points="21,13 16,9 19,4.5 25,6 25.5,12"/>
    <!-- Lower-left -->
    <polygon points="13,19 11,13 6.5,12 4.5,18 8,23"/>
    <!-- Lower-right -->
    <polygon points="19,19 21,13 25.5,12 27.5,18 24,23"/>
    <!-- Bottom -->
    <polygon points="16,27 13,19 8,23 10,29 16,30.5 22,29 24,23 19,19"/>
  </g>
  <!-- Ball outline -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#2d2d2d" stroke-width="1.5"/>
</svg>
